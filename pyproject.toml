[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-engineering-agent"
version = "0.1.0"
description = "Foundation for a future local backend engineering AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Backend Engineering Agent contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
model = [
  "torch>=2.0",
]
pretrained = [
  "torch>=2.0",
  "transformers>=4.48,<5",
  "safetensors>=0.4",
  "huggingface_hub>=0.27",
]

[project.scripts]
fodci = "backend_ai.cli.main:main"

[project.urls]
Repository = "https://github.com/peterisaac-00/Fodci_Ai"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend_ai*"]

[tool.setuptools.package-data]
backend_ai = ["evaluation/datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["backend_ai"]
